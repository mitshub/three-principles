*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:16px}

nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 2rem}
.nav-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px}
.nav-logo{font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--text)}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{font-size:13px;color:var(--text2);text-decoration:none;transition:color .15s}
.nav-links a:hover{color:var(--text)}

section{padding:5rem 2rem}
.inner{max-width:860px;margin:0 auto}

#hero{background:var(--bg);padding:7rem 2rem 5rem}
.hero-kicker{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--green);text-transform:uppercase;margin-bottom:1.25rem}
.hero-title{font-size:clamp(2rem,5vw,3.2rem);font-weight:700;line-height:1.2;margin-bottom:1.5rem;letter-spacing:-.02em}
.hero-title span{color:var(--green)}
.hero-lead{font-size:1.1rem;color:var(--text2);max-width:580px;line-height:1.8;margin-bottom:2rem}
.hero-badges{display:flex;gap:.75rem;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:0.5px solid}
.badge-s{background:var(--purple-light);color:var(--purple);border-color:var(--purple)}
.badge-w{background:var(--blue-light);color:var(--blue);border-color:var(--blue)}
.badge-e{background:var(--amber-light);color:var(--amber);border-color:var(--amber)}

.sec-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--green);text-transform:uppercase;margin-bottom:.75rem}
.sec-title{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.75rem}
.sec-lead{color:var(--text2);max-width:620px;line-height:1.8;margin-bottom:2.5rem}

#why{background:var(--bg2)}
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.25rem;margin-bottom:2.5rem}
.why-card{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:1.5rem}
.why-card-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:18px}
.why-card h3{font-size:15px;font-weight:600;margin-bottom:.5rem}
.why-card p{font-size:14px;color:var(--text2);line-height:1.7}

.svg-wrap{background:var(--bg2);border-radius:16px;overflow:hidden;padding:1rem}
.pull-quote{border-left:3px solid var(--green);padding:.75rem 1.25rem;margin:2rem 0;background:var(--green-light);border-radius:0 8px 8px 0}
.pull-quote p{font-size:1rem;font-style:italic;color:#085041;line-height:1.7}

#beforeafter{background:var(--bg2)}
.ba-grid{display:grid;grid-template-columns:1fr 36px 1fr;gap:0;align-items:start}
.ba-col-head{font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;text-align:center;margin-bottom:10px}
.before-head{background:var(--red-light);color:var(--red-dark)}
.after-head{background:var(--green-light);color:#085041}
.ba-card{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6}
.ba-before{background:var(--red-light);border:0.5px solid #F09595;margin-bottom:8px}
.ba-after{background:var(--green-light);border:0.5px solid #5DCAA5;margin-bottom:8px}
.ba-before b{color:var(--red-dark);font-weight:600}
.ba-after b{color:#085041;font-weight:600}
.ba-arrow{display:flex;align-items:flex-start;justify-content:center;padding-top:38px;color:var(--text3);font-size:20px}
.ba-section-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text3);text-transform:uppercase;margin:1.25rem 0 .5rem}
.chip{display:inline-block;background:var(--green-light);color:#085041;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:4px}
.ba-footer{margin-top:1.5rem;padding:1rem 1.25rem;background:var(--bg);border-radius:10px;font-size:13px;color:var(--text2);text-align:center;line-height:1.7;border:0.5px solid var(--border)}

#map-section{background:var(--bg)}
.map-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.map-tab{padding:6px 16px;border:0.5px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;background:var(--bg);color:var(--text2);transition:all .15s}
.map-tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.map-container{position:relative;width:100%;background:var(--bg2);border-radius:16px;overflow:hidden;margin-bottom:.75rem}
#world-svg{width:100%;display:block}
.map-tooltip{position:absolute;background:var(--bg);border:0.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;pointer-events:none;display:none;z-index:10;min-width:150px}
.tt-name{font-weight:600;font-size:13px;margin-bottom:4px}
.tt-row{display:flex;justify-content:space-between;gap:12px;color:var(--text2);margin-bottom:2px}
.tt-val{color:var(--text);font-weight:600}
.map-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);margin-bottom:1.25rem;flex-wrap:wrap}
.leg-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;flex:1;min-width:140px;max-width:220px}
.leg-seg{flex:1}
.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:.75rem}
.mc{background:var(--bg2);border-radius:10px;padding:.75rem 1rem}
.mc-label{font-size:11px;color:var(--text2);margin-bottom:3px}
.mc-val{font-size:20px;font-weight:700;color:var(--text)}
.mc-sub{font-size:11px;color:var(--text3);margin-top:1px}
.map-note{font-size:11px;color:var(--text3);line-height:1.6}

#approach{background:var(--bg2)}
.approach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.ap-card{background:var(--bg);border-radius:12px;padding:1.25rem;border:0.5px solid var(--border)}
.ap-num{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.06em;margin-bottom:.5rem}
.ap-card h4{font-size:14px;font-weight:600;margin-bottom:.4rem}
.ap-card p{font-size:13px;color:var(--text2);line-height:1.65}

#cta{background:var(--text);color:var(--bg);padding:5rem 2rem;text-align:center}
#cta .sec-label{color:#5DCAA5}
#cta .sec-title{color:var(--bg);font-size:2rem;margin-bottom:1rem}
#cta p{color:rgba(255,255,255,.65);max-width:520px;margin:0 auto 2rem;line-height:1.8}
.cta-btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.btn-primary{padding:10px 24px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-secondary{padding:10px 24px;background:transparent;color:rgba(255,255,255,.8);border:0.5px solid rgba(255,255,255,.3);border-radius:8px;font-size:14px;cursor:pointer}

footer{background:var(--bg);border-top:0.5px solid var(--border);padding:2rem;text-align:center}
footer p{font-size:12px;color:var(--text3)}
.divider{border:none;border-top:0.5px solid var(--border);margin:1.5rem 0}
</style>
