<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three Principles OG Image</title>
<!-- Source for og-image.png (1200x630). Regenerate after editing. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background-color:#1a1a1a;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:60px 60px;
  color:#fff;position:relative
}
.bar{position:absolute;left:0;top:0;width:6px;height:100%;background:#1D9E75}
.content{position:absolute;left:100px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.chips{display:flex;gap:12px;margin-bottom:36px}
.chip{font-size:16px;font-weight:500;padding:6px 18px;border-radius:999px;border:1px solid}
.chip.s{color:#a99cf0;background:rgba(127,119,221,.15);border-color:rgba(127,119,221,.35)}
.chip.w{color:#5fb4ee;background:rgba(55,138,221,.15);border-color:rgba(55,138,221,.35)}
.chip.e{color:#f2b268;background:rgba(239,159,39,.15);border-color:rgba(239,159,39,.35)}
h1{font-size:68px;font-weight:800;line-height:1.1;letter-spacing:-.035em}
h1 span{color:#1D9E75}
.lead{font-size:22px;line-height:1.7;color:rgba(255,255,255,.62);margin-top:30px;max-width:520px}
.url{position:absolute;left:100px;bottom:48px;font-size:18px;color:rgba(255,255,255,.38)}
.stat{position:absolute;right:100px;top:50%;transform:translateY(-50%);text-align:right;padding-left:48px;border-left:1px solid rgba(255,255,255,.12)}
.stat-num{font-size:96px;font-weight:800;color:#1D9E75;line-height:1;letter-spacing:-.04em}
.stat-label{font-size:20px;color:rgba(255,255,255,.62);margin-top:12px}
</style>
</head>
<body>
<div class="bar"></div>
<div class="content">
  <div class="chips">
    <span class="chip s">Security</span>
    <span class="chip w">Water</span>
    <span class="chip e">Education</span>
  </div>
  <h1>A framework for<br><span>human progress.</span></h1>
  <p class="lead">Solving humanity's greatest challenges starts with three foundations guaranteed for all.</p>
</div>
<div class="stat">
  <div class="stat-num">94</div>
  <div class="stat-label">countries mapped</div>
</div>
<div class="url">three-principles.org</div>
</body>
</html>
